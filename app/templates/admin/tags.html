{% extends "base.html" %}
{% block content %}
<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">Tags</h1>
    <a href="{{ url_for('admin.new_tag') }}" class="btn btn-primary btn-sm">+ New Tag</a>
  </div>
  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead>
          <tr>
            <th>Name</th>
            <th>Colour</th>
            <th>Description</th>
            <th>Active</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          {% for t in tags %}
          <tr>
            <td><span class="badge" style="background:{{ t.Colour }}">{{ t.Name }}</span></td>
            <td><code>{{ t.Colour }}</code></td>
            <td>{{ t.Description or '—' }}</td>
            <td>{{ 'Yes' if t.IsActive else 'No' }}</td>
            <td class="text-end">
              <a href="{{ url_for('admin.edit_tag', tag_id=t.TagID) }}" class="btn btn-sm btn-outline-secondary">Edit</a>
            </td>
          </tr>
          {% else %}
          <tr><td colspan="5" class="text-center text-muted py-4">No tags yet.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
