{% extends "base.html" %}
{% block title %}Departments{% endblock %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
    <h2>Departments</h2>
    <a href="{{ url_for('admin.new_department') }}" class="btn btn-primary btn-sm">Add Department</a>
</div>
<div class="card">
    <table class="table mb-0">
        <thead class="table-light"><tr><th>Name</th><th>Active</th><th>Actions</th></tr></thead>
        <tbody>
            {% for d in departments %}
            <tr>
                <td>{{ d.DepartmentName }}</td>
                <td>{% if d.IsActive %}Yes{% else %}No{% endif %}</td>
                <td><a href="{{ url_for('admin.edit_department', dept_id=d.DepartmentID) }}" class="btn btn-sm btn-outline-primary">Edit</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
