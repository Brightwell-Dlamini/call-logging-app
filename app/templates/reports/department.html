{% extends "base.html" %}
{% block content %}
<h2 class="mb-3">Calls by Department</h2>
<div class="card">
    <table class="table mb-0">
        <thead class="table-light"><tr><th>Department</th><th>Call Count</th></tr></thead>
        <tbody>
            {% for name, count in results %}
            <tr><td>{{ name }}</td><td><span class="badge bg-primary">{{ count }}</span></td></tr>
            {% else %}
            <tr><td colspan="2" class="text-muted text-center">No data.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
