{% extends 'base.html' %}
{% block title %}Sign out{% endblock %}
{% block content %}
<div class="container py-4" style="max-width: 32rem;">
    <div class="card">
        <div class="card-body">
            <h1 class="h4 mb-2">Sign out</h1>
            <p class="text-muted">End this session on this browser. You will need to sign in again to open the desk.</p>
            <form method="post" action="{{ url_for('auth.logout') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="btn btn-primary">Sign out</button>
                <a href="{{ url_for('dashboard.index') }}" class="btn btn-secondary">Stay signed in</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
