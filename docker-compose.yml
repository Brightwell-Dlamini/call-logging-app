# Local stack: app + Postgres.
# Usage:
#   docker compose up --build
# App: http://127.0.0.1:8000
# Override SECRET_KEY in a local .env (never commit real values).
# sslmode=disable is required because config.normalize_database_url
# otherwise appends sslmode=require (correct for Neon, wrong for this image).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: calllog
      POSTGRES_PASSWORD: calllog
      POSTGRES_DB: calllog
    ports:
      - "5432:5432"
    volumes:
      - calllog_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calllog -d calllog"]
      interval: 5s
      timeout: 5s
      retries: 8

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      FLASK_ENV: production
      SECRET_KEY: compose-dev-only-change-me
      DATABASE_URL: postgresql://calllog:calllog@db:5432/calllog?sslmode=disable
      ENABLE_SEED: "1"
    depends_on:
      db:
        condition: service_healthy

volumes:
  calllog_pg:
