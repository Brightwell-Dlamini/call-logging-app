[project]
name = "call-logging-app"
version = "1.0.0"
description = "Call Logging Application"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0.0",
    "Flask-SQLAlchemy>=3.1.0",
    "Flask-Login>=0.6.3",
    "Flask-WTF>=1.2.0",
    "Flask-Migrate>=4.0.0",
    "Flask-Caching>=2.3.0",
    "Flask-Limiter>=3.8.0",
    "Werkzeug>=3.0.0",
    "SQLAlchemy>=2.0.0",
    "WTForms>=3.1.0",
    "email-validator>=2.0.0",
    "python-dotenv>=1.0.0",
    "Jinja2>=3.1.0",
    "itsdangerous>=2.2.0",
    "click>=8.1.0",
    "alembic>=1.13.0",
    "reportlab>=4.0.0",
    "openpyxl>=3.1.0",
    "python-dateutil>=2.9.0",
    "PyMySQL>=1.1.0",
    "cryptography>=43.0.0",
]

[tool.vercel]
entrypoint = "run:app"
